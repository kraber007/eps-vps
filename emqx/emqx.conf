## ============================================================
## EMQX config for the mushroom farm broker.
##
## Auth model:
##  - Authentication: Postgres backend. Client connects with
##    username = slot id (UUID), password = plaintext that's
##    checked against slots.mqtt_password_hash (bcrypt).
##  - Authorization: file-based ACL rule using the %u
##    (username) placeholder, so every slot is confined to its
##    own `slot/<its-own-id>/...` topics with a single static
##    rule -- no per-slot DB rows or extra query needed.
## ============================================================

node {
  name = "emqx@mushroom-broker"
  cookie = "mushroom-farm-emqx-cookie"
  data_dir = "/opt/emqx/data"
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
}

listeners.ssl.default {
  bind = "0.0.0.0:8883"

  ssl_options {
    certfile = "/etc/letsencrypt/live/mqtt.mycoai.bandhuja.com/fullchain.pem"
    keyfile = "/etc/letsencrypt/live/mqtt.mycoai.bandhuja.com/privkey.pem"

    verify = verify_none
    fail_if_no_peer_cert = false
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
}

dashboard.listeners.http.bind = 18083

authentication = [
  {
    mechanism = password_based
    backend = postgresql
    enable = false

    #not using below, env-vars are being used for below data
    #server = "${EMQX_PG_HOST}:${EMQX_PG_PORT}"
    #database = "${EMQX_PG_DATABASE}"
    #username = "${EMQX_PG_USERNAME}"
    #password = "${EMQX_PG_PASSWORD}"
    ssl.enable = false

    ## slots.id is UUID; the incoming username is text, so cast it.
    ## status check keeps retired/disabled slots from authenticating
    ## even if their old password hash is still in the DB.
    query = "SELECT mqtt_password_hash as password_hash FROM slots WHERE id = ${username}::uuid AND status <> 'retired'"

    password_hash_algorithm {
      name = bcrypt
    }
  }
]

authorization {
  sources = [
    {
      type = file
      enable = false
      path = "/opt/emqx/etc/acl.conf"
    }
  ]

  ## Anything not explicitly allowed below is rejected.
  no_match = allow      #todo set this to deny in production
  deny_action = disconnect
}
