%% Every connected client's username IS its slot id (see emqx.conf
%% authentication query + db/init.sql). %u substitutes the
%% connecting client's own username at check time, so this one
%% rule confines every slot to its own topic tree -- a slot can
%% never subscribe or publish under a different slot's id.

{allow, all, all, ["slot/%u/#"]}.

%% Explicit deny-all fallback (belt and suspenders alongside
%% authorization.no_match = deny in emqx.conf).
{deny, all}.
