services:
  timescaledb:
    image: timescale/timescaledb:2.26.1-pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      EMQX_PG_USERNAME: ${EMQX_PG_USERNAME}
      EMQX_PG_PASSWORD: ${EMQX_PG_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/00_create_emqx_role.sh:/docker-entrypoint-initdb.d/00_create_emqx_role.sh:ro
      - ./db/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_grant_emqx_permissions.sh:/docker-entrypoint-initdb.d/02_grant_emqx_permissions.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mushroom-net

  emqx:
    image: emqx/emqx-enterprise:6.3
    restart: unless-stopped
    expose:
      - "1883"
    ports:
      #- "1883:1883"     # MQTT
      #- "8883:8883"     # MQTT
      #- "8083:8083"     # MQTT over WebSocket (handy for browser-based debugging)
      - "18083:18083"   # Dashboard - put behind a reverse proxy / firewall in prod
    environment:
      EMQX_AUTHENTICATION__1__SERVER: "timescaledb:5432"
      EMQX_AUTHENTICATION__1__DATABASE: ${POSTGRES_DB}
      EMQX_AUTHENTICATION__1__USERNAME: ${EMQX_PG_USERNAME}
      EMQX_AUTHENTICATION__1__PASSWORD: ${EMQX_PG_PASSWORD}
    volumes:
      - ./emqx/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ./emqx/base.hocon:/opt/emqx/etc/base.hocon:ro
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - emqx-data:/opt/emqx/data
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "emqx_ctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mushroom-net

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8883:8883"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - mushroom-net

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN}
      GF_SERVER_ROOT_URL: https://${GRAFANA_DOMAIN}/
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - mushroom-net

networks:
  mushroom-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
  emqx-data:
  timescale-data:
  grafana-data:
