events {}

http {

    # ============================================================
    # Main domain - HTTP → HTTPS
    # ============================================================

    server {
        listen 80;
        server_name mycoai.bandhuja.com;

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ============================================================
    # Main domain - HTTPS
    # ============================================================

    server {
        listen 443 ssl;
        server_name mycoai.bandhuja.com;

        ssl_certificate
            /etc/letsencrypt/live/mycoai.bandhuja.com/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/live/mycoai.bandhuja.com/privkey.pem;

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            return 200 "Mushroom IoT Nginx is working\n";
        }
    }


    # ============================================================
    # Grafana - HTTP → HTTPS
    # ============================================================

    server {
        listen 80;
        server_name grafana-mycoai.bandhuja.com;

        location / {
            return 301 https://$host$request_uri;
        }
    }


    # ============================================================
    # Grafana - HTTPS → Grafana container
    # ============================================================

    server {
        listen 443 ssl;
        server_name grafana-mycoai.bandhuja.com;

        ssl_certificate
            /etc/letsencrypt/live/grafana-mycoai.bandhuja.com/fullchain.pem;

        ssl_certificate_key
            /etc/letsencrypt/live/grafana-mycoai.bandhuja.com/privkey.pem;

        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            proxy_pass http://grafana:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
